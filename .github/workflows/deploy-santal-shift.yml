name: Deploy Santal Shift Mini App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "apps/santal-shift/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-santal-shift.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://santal-shift-app.taigisch11.workers.dev/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SANTAL_TELEGRAM_BOT_TOKEN: ${{ secrets.SANTAL_TELEGRAM_BOT_TOKEN }}
      SANTAL_TELEGRAM_TOKEN_ROTATED_AT: ${{ secrets.SANTAL_TELEGRAM_TOKEN_ROTATED_AT }}
      SANTAL_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.SANTAL_TELEGRAM_WEBHOOK_SECRET }}
      SANTAL_ADMIN_SETUP_TOKEN: ${{ secrets.SANTAL_ADMIN_SETUP_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.SANTAL_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.SANTAL_GOOGLE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Santal Shift
        run: npm run test --workspace @santal/shift

      - name: Typecheck Santal Shift
        run: npm run build --workspace @santal/shift

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SANTAL_TELEGRAM_BOT_TOKEN"
          test -n "$SANTAL_TELEGRAM_WEBHOOK_SECRET"
          test -n "$SANTAL_ADMIN_SETUP_TOKEN"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$SANTAL_TELEGRAM_TOKEN_ROTATED_AT"
            test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
            test -n "$GOOGLE_PRIVATE_KEY"
            [[ "$SANTAL_TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{16,256}$ ]]
            ROTATED_TS="$(node -e 'const value=process.env.SANTAL_TELEGRAM_TOKEN_ROTATED_AT; const t=Date.parse(value); if (!Number.isFinite(t)) process.exit(2); const maxAgeDays=14; if (Date.now()-t > maxAgeDays*24*60*60*1000) process.exit(3); console.log(new Date(t).toISOString())')"
            echo "Telegram token rotation timestamp: ${ROTATED_TS}"
          fi

      - name: Deploy Worker shell
        working-directory: apps/santal-shift
        run: npx wrangler deploy

      - name: Upload Worker secrets
        working-directory: apps/santal-shift
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf "%s" "$value" | npx wrangler secret put "$name"
            fi
          }
          put_secret "TELEGRAM_BOT_TOKEN" "$SANTAL_TELEGRAM_BOT_TOKEN"
          put_secret "TELEGRAM_TOKEN_ROTATED_AT" "$SANTAL_TELEGRAM_TOKEN_ROTATED_AT"
          put_secret "TELEGRAM_WEBHOOK_SECRET" "$SANTAL_TELEGRAM_WEBHOOK_SECRET"
          put_secret "ADMIN_SETUP_TOKEN" "$SANTAL_ADMIN_SETUP_TOKEN"
          put_secret "GOOGLE_SERVICE_ACCOUNT_EMAIL" "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
          put_secret "GOOGLE_PRIVATE_KEY" "$GOOGLE_PRIVATE_KEY"

      - name: Deploy Worker with secrets
        working-directory: apps/santal-shift
        run: npx wrangler deploy

      - name: Initialize Google Sheet structure
        if: github.event_name == 'workflow_dispatch' && env.GOOGLE_SERVICE_ACCOUNT_EMAIL != '' && env.GOOGLE_PRIVATE_KEY != '' && env.SANTAL_ADMIN_SETUP_TOKEN != ''
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${SANTAL_ADMIN_SETUP_TOKEN}" \
            "${WORKER_URL}api/admin/setup-sheet"

      - name: Configure Telegram bot
        if: env.SANTAL_TELEGRAM_BOT_TOKEN != ''
        run: |
          node <<'NODE'
          const token = process.env.SANTAL_TELEGRAM_BOT_TOKEN;
          const webAppUrl = process.env.WORKER_URL;
          const webhookSecret = process.env.SANTAL_TELEGRAM_WEBHOOK_SECRET || "";

          async function call(method, payload) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok || !result.ok) {
              throw new Error(`${method} failed: ${JSON.stringify(result)}`);
            }
          }

          await call("setMyCommands", {
            commands: [
              { command: "start", description: "Открыть приложение" },
              { command: "my", description: "Мои смены" },
              { command: "today", description: "Что актуально сегодня" },
              { command: "money", description: "Начисления и выплаты" },
              { command: "help", description: "Помощь по боту" }
            ]
          });
          await call("setChatMenuButton", {
            menu_button: {
              type: "web_app",
              text: "Смены",
              web_app: { url: webAppUrl }
            }
          });
          await call("setWebhook", {
            url: `${webAppUrl}api/telegram/webhook`,
            secret_token: webhookSecret,
            drop_pending_updates: true
          });
          NODE

      - name: Verify Telegram webhook
        if: env.SANTAL_TELEGRAM_BOT_TOKEN != ''
        run: |
          node <<'NODE'
          const token = process.env.SANTAL_TELEGRAM_BOT_TOKEN;
          const expectedUrl = `${process.env.WORKER_URL}api/telegram/webhook`;
          const response = await fetch(`https://api.telegram.org/bot${token}/getWebhookInfo`);
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(`getWebhookInfo failed: ${JSON.stringify(result)}`);
          }
          const info = result.result || {};
          console.log(JSON.stringify({
            url: info.url,
            pending_update_count: info.pending_update_count,
            last_error_date: info.last_error_date || null,
            has_last_error_message: Boolean(info.last_error_message)
          }, null, 2));
          if (info.url !== expectedUrl) {
            throw new Error(`Unexpected webhook URL: ${info.url}`);
          }
          if (info.last_error_message) {
            throw new Error(`Telegram webhook has error: ${info.last_error_message}`);
          }
          NODE

      - name: Check release readiness
        run: |
          node <<'NODE'
          const response = await fetch(`${process.env.WORKER_URL}api/release/readiness`);
          const payload = await response.json();
          console.log(JSON.stringify(payload, null, 2));
          if (!response.ok) {
            throw new Error(`Readiness endpoint failed with HTTP ${response.status}`);
          }
          if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch" && !payload.ready) {
            throw new Error(`Manual market release is blocked: ${payload.marketReadinessPercent}% ready`);
          }
          NODE
